<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ADL Payouts</title>
  <link rel="stylesheet" href="../assets/gm-menu.css?v=module-header-2">
  <link rel="stylesheet" href="payouts.css?v=weekly-below">
  <script src="../assets/gm-menu.js?v=module-header-2" defer></script>
  <script src="payouts.js?v=earnings-logo" defer></script>
<link rel="stylesheet" href="../assets/gm-module-header.css?v=1">
</head>
<body class="adl">
  <div class="payout-shell">
    <header class="mast" data-gm-module-header data-league="ADL" data-logo="../adl-shield.png" data-season="2026" data-season-id="mast-season"><h1>Payouts</h1></header><script src="../assets/gm-module-header.js?v=1"></script>
    <main>
      <div class="page-heading"><p id="coverage" role="status">Loading payout data…</p></div>
      <p id="load-error" role="alert" hidden>The payout data could not be loaded. Please reload the page.</p>
      <noscript>Enable JavaScript to view the awards and money distribution.</noscript>
      <div id="views" hidden>
        <div class="tabs" role="tablist" aria-label="Payouts views">
          <button id="awards-tab" role="tab" aria-controls="awards" aria-selected="true">Awards</button>
          <button id="money-tab" role="tab" aria-controls="money" aria-selected="false" tabindex="-1">Money</button>
        </div>
        <section id="awards" role="tabpanel" aria-labelledby="awards-tab" tabindex="0">
          <div class="section-heading">
            <h2>Conference awards</h2>
          </div>
          <div id="awards-table"></div>
        </section>
        <section id="money" role="tabpanel" aria-labelledby="money-tab" tabindex="0" hidden>
          <dl id="money-summary" class="money-summary" aria-label="League payout totals"></dl>
          <div class="money-grid">
            <section aria-labelledby="prizes-heading">
              <h2 id="prizes-heading">Prize schedule</h2>
              <div id="prize-schedule" class="prize-schedule"></div>
              <p class="prize-note">Amounts are per conference except where marked league-wide.</p>
            </section>
            <section aria-labelledby="balances-heading">
              <h2 id="balances-heading">Team balances</h2>
              <div id="team-ledger" class="conference-ledgers"></div>
            </section>
          </div>
        </section>
      </div>
    </main>
  </div>
  <div id="balance-breakdown" class="balance-breakdown" role="tooltip" hidden></div>
</body>
</html>
