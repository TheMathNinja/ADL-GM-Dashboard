mes">Adj. Wins</th><th>All-Play %</th><th>Playoff seed</th><th>Potential PPG</th></tr>`;   rows.innerHTML=[...draft[state.conference]].sort((a,b)=>Number(a[pickKey])-Number(b[pickKey])).map((r,i)=>(i===9?`<tr class="adl-cut"><td colspan="6">${projected?'Projected':'Current'} playoff teams</td></tr>`:i===0?`<tr class="adl-cut"><td colspan="6">${projected?'Projected':'Current'} non-playoff teams</td></tr>`:'')+`<tr><td><span class="adl-seed">${r[pickKey]}</span></td><td>${team(r)}</td><td>${Number(r[prefix+'AdjWins']).toFixed(1)}</td><td>${forecastMetric(r,'ap',(Number(r[prefix+'ApPct'])*100).toFixed(1)+'%')}</td><td>${r[seedKey]==='NA'?'Out':'#'+r[seedKey]}</td><td>${forecastMetric(r,'draftpot',Number(r[potKey]).toFixed(1))}</td></tr>`).join('');   return; } const projectedOrder=state.playoffPicture==='projected'; const list=[...data[state.conference]].sort((a,b)=>Number(projectedOrder?a.finish:a.seed)-Number(projectedOrder?b.finish:b.seed)||Number(a.seed)-Number(b.seed)); const playoffHeader='<tr class="adl-column-headings"><th>Seed</th><th>Team</th><th>Record</th><th title="Division games back, including Bonus Games">Div GB</th><th>All-Play %</th><th>PPG</th><th>Proj. wins</th><th>Playoff odds</th></tr>'; head.innerHTML=playoffHeader; rows.innerHTML=list.map((t,i)=>{   const seed=t.playoffSeed==='NA'?'Outside field (conference finish '+t.finish+')':'#'+t.playoffSeed;   const odds=forecastMetric(t,'odds',`<span class="adl-odds">${state.bars?`<span class="adl-track" aria-hidden="true"><i style="width:${t.odds}"></i></span>`:''}<span class="adl-percent">${t.odds}</span></span>`);   const qual=projectedOrder?t.projectedQual:t.qual;   const status=t.clinch?clinchStatus(t.clinch,({b:'Clinched #1 Seed',d:'Clinched division',p:'Clinched playoffs',e:'Eliminated'})[t.clinch]):'';   return (i===7?'<tr class="adl-cut adl-ladder-cut"><td colspan="8">Consolation Ladder</td></tr>'+playoffHeader:'')+`<tr><td><span class="adl-seed ${i<7?'in':''}">${projectedOrder?t.finish:t.seed}</span></td><td><div class="adl-teamcell">${status}${team(t)}${(qual?`<span class="adl-qual">${qual==='y'?'D':'W'}</span>`:'')}</div></td><td>${forecastMetric(t,'record',String(t.record).replace(/^(\d+-\d+)-0$/, '$1'))}</td><td>${forecastMetric(t,'divgb',divisionGBLabel(t))}</td><td>${forecastMetric(t,'ap',(Number(t.apPct)*100).toFixed(1)+'%')}</td><td><button type="button" class="adl-metric" data-ppg="${t.name}" aria-label="${t.name}: ${t.ppg} points per game; show breakdown" aria-describedby="adl-ppg-popup" aria-expanded="false">${t.ppg}</button></td><td>${forecastMetric(t,'wins',Number(t.wins).toFixed(1))}</td><td>${odds}</td></tr>`; }).join('');}root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;render()}));root.querySelectorAll('[data-draft-picture]').forEach(b=>b.addEventListener('click',()=>{state.draftPicture=b.dataset.draftPicture;render()}));root.querySelectorAll('[data-picture]').forEach(b=>b.addEventListener('click',()=>{state[state.view==='bracket'?'bracketPicture':'playoffPicture']=b.dataset.picture;render()}));root.querySelectorAll('[data-conf]').forEach(b=>b.addEventListener('click',()=>{state.conference=b.dataset.conf;render()}));window.addEventListener('message',e=>{const frame=root.querySelector('#adl-bracket iframe');if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='bracket-height'&&Number.isFinite(e.data.height))frame.style.height=Math.max(600,e.data.height)+'px';});render();})();</script></div><script src="../assets/gm-menu.js?v=module-header-2" defer></script></body></html>
