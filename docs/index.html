<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ADL GM Dashboard</title>
  <style>
    :root {
      --ink: #1f2937;
      --muted: #667085;
      --line: #d0d5dd;
      --panel: #ffffff;
      --page: #f3f5f7;
      --red: #c83a3f;
      --blue: #174ea6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--page);
    }
    header {
      display: flex;
      align-items: center;
      gap: 1.4rem;
      padding: 1.1rem 1.5rem;
      background: linear-gradient(90deg, #8b8b8b 0%, #a3a9ae 10%, #c9ced3 28%, #d8dde2 44%, #d8dde2 100%);
      border-bottom: 2px solid var(--red);
    }
    header img {
      width: 5.15rem;
      height: 6.1rem;
      object-fit: contain;
    }
    header h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 2rem 1.25rem;
    }
    .tool {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: center;
      padding: 1.25rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
    }
    h2 {
      margin: 0 0 0.35rem;
      font-size: 1.25rem;
      line-height: 1.2;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.5rem;
      padding: 0 1rem;
      border-radius: 6px;
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
    }
    @media (max-width: 680px) {
      .tool {
        grid-template-columns: 1fr;
      }
      a.button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="adl-shield.png" alt="ADL shield" />
    <h1>GM Dashboard</h1>
  </header>
  <main>
    <section class="tool">
      <div>
        <h2>Contract Extension Calculator</h2>
        <p>Interactive ADL extension pricing with current roster context, eligibility checks, position-rank math, 5YO handling, and smoothing breakdowns.</p>
      </div>
      <a class="button" href="https://analyticsff.shinyapps.io/adl-gm-dashboard/">Open Calculator</a>
    </section>
  </main>
</body>
</html>
