name: Email weekly refresh completion
on:
  workflow_run:
    workflows: [Refresh ADL Weekly System]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify completion and preview without emailing
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: weekly-completion-email
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request report from the configured Commissioner email sender
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          gh workflow run email_weekly_completion.yml --repo TheMathNinja/ADL-Commissioner-Dashboard -f dry_run="$DRY_RUN"
