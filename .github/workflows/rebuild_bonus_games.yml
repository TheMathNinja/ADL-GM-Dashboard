name: Rebuild Bonus Games dashboard
on:
  workflow_dispatch:
permissions:
  actions: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild both consumers of the shared quarterly model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST 'repos/${{ github.repository }}/actions/workflows/rebuild_playoff_model.yml/dispatches' -f ref=main
