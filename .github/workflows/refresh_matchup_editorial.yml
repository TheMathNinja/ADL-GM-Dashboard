name: Refresh matchup editorial selection
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: matchup-editorial
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Refresh official Game of the Week and archived stakes
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from weekly_matchup_stakes import build
          manifest = json.loads(Path('docs/bonus-games/matchups/index.json').read_text())
          build(Path('.'), manifest['league'], int(manifest['season']))
          PY
      - name: Publish changed editorial data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bonus-games/matchups/stakes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh official matchup editorial selection"
          git pull --rebase origin main
          git push origin HEAD:main
