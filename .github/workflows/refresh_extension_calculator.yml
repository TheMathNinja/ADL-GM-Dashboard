name: Official ADL Weekly League Update
run-name: ${{ inputs.authorize_official_writes != true && 'ADL manual preview' || inputs.score_revision != '' && format('Official ADL correction update · Week {0} · {1}', inputs.ready_week, inputs.score_revision) || inputs.ready_week != '' && format('Preliminary ADL weekly update · Week {0}', inputs.ready_week) || 'ADL weekly league update' }}

on:
  workflow_dispatch:
    inputs:
      triggered_at:
        description: "UTC time when the MFL checker dispatched this refresh"
        type: string
        default: ""
      trigger_run_id:
        description: "GitHub run ID of the dispatching MFL checker"
        type: string
        default: ""
      score_revision:
        description: "Player-score revision detected by Thursday correction poll"
        type: string
        default: ""
      ready_week:
        description: "Week validated by the preliminary-score readiness poll"
        type: string
        default: ""
      score_status:
        description: "Score scrape status"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - unofficial
          - official
      force:
        description: "Force refresh outside the normal season window"
        required: true
        default: false
        type: boolean
      capture_cap_snapshot:
        description: "Authorize the readiness-poll run to capture the official weekly cap snapshot"
        required: true
        default: false
        type: boolean
      authorize_official_writes:
        description: "Authorize readiness-poll writes to Google Sheets and MFL"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write

concurrency:
  group: gm-dashboard-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      CURRENT_SEASON: "2026"
      ADL_SCORE_WEEK: ${{ inputs.ready_week }}
      READY_WEEK: ${{ inputs.ready_week }}
      TRIGGERED_AT: ${{ inputs.triggered_at }}
      TRIGGER_RUN_ID: ${{ inputs.trigger_run_id }}
      REFRESH_PROCESS: ${{ inputs.score_revision != '' && 'corrections' || 'preliminary' }}
      LEAGUE_ID: "60206"
      ADL_RAW_LEAGUE_DATA_DIR: cache/raw_league_data
      R_LIBS_USER: ${{ github.workspace }}/_lib
      SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
      SHINYAPPS_APP_NAME: adl-ext-calculator
      ADL_GITHUB_WORKFLOW_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
      ADL_LEAGUE_ID: ${{ secrets.ADL_LEAGUE_ID }}
      MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
      MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
      MFL_USER_AGENT: ${{ secrets.MFL_USER_AGENT }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Decide score status and season window
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SCORE_STATUS: ${{ inputs.score_status || 'manual' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: python3 scripts/score_schedule.py

      - name: Create cache directories
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          mkdir -p "${ADL_RAW_LEAGUE_DATA_DIR}"
          mkdir -p "${R_LIBS_USER}"
          mkdir -p data

      - name: Restore raw league data cache
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.ADL_RAW_LEAGUE_DATA_DIR }}
          key: ${{ runner.os }}-gm-raw-league-data-${{ env.CURRENT_SEASON }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-gm-raw-league-data-${{ env.CURRENT_SEASON }}-

      - name: Restore completed playoff training history
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: cache/playoff-picture
          key: ${{ runner.os }}-playoff-history-v1-${{ env.CURRENT_SEASON }}

      - name: Restore R package library cache
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-gm-r-lib-v1-${{ hashFiles('DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-gm-r-lib-v1-

      - name: Install Ubuntu system libraries and R
        if: steps.schedule.outputs.should_run == 'true'
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            r-base \
            r-base-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libssl-dev \
            libtiff5-dev \
            libxml2-dev \
            libuv1-dev \
            libnode-dev \
            pkg-config


      - name: Install and verify R packages
        if: steps.schedule.outputs.should_run == 'true'
        timeout-minutes: 12
        shell: Rscript {0}
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
          .libPaths(Sys.getenv("R_LIBS_USER"))
          options(repos = c(
            ffverse = "https://ffverse.r-universe.dev",
            CRAN = "https://cloud.r-project.org"
          ))

          packages <- c(
            "bslib", "dplyr", "ffscrapr", "ggplot2", "glue", "gt", "htmltools", "httr", "jsonlite", "lubridate",
            "nflreadr", "purrr", "readr", "readxl", "rsconnect", "scales", "googlesheets4",
            "shiny", "stringr", "tibble", "tidyr"
          )
          missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]

          if (length(missing) > 0) {
            install.packages(
              missing,
              dependencies = c("Depends", "Imports", "LinkingTo"),
              Ncpus = max(1, parallel::detectCores() - 1)
            )
          }

          min_rsconnect_version <- "1.10.1"
          if (requireNamespace("rsconnect", quietly = TRUE) && packageVersion("rsconnect") < min_rsconnect_version) {
            message("Updating rsconnect from ", packageVersion("rsconnect"), " to at least ", min_rsconnect_version, ".")
            install.packages("rsconnect", dependencies = c("Depends", "Imports", "LinkingTo"))
          }
          still_missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
          if (length(still_missing) > 0) {
            stop("R packages still not installed: ", paste(still_missing, collapse = ", "))
          }

      - uses: actions/setup-python@v5
        if: steps.schedule.outputs.should_run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-weekly.txt

      - name: Install weekly Python dependencies
        if: steps.schedule.outputs.should_run == 'true'
        timeout-minutes: 5
        run: |
          pip install -r requirements-weekly.txt
          echo "BONUS_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Verify EXT publication regression cases
        run: |
          Rscript tests/test_ext_publication_integrity.R
          Rscript tests/test_ext_pending_status.R
          Rscript tests/test_completed_season_ppg.R
          Rscript tests/test_pr_rank_popovers.R
      - name: Capture player-score baseline before refresh
        if: inputs.ready_week != '' && steps.schedule.outputs.should_run == 'true'
        run: |
          python3 scripts/correction_impact.py capture --league ADL --week "$READY_WEEK"
          python3 scripts/score_corrections.py --capture --week "$READY_WEEK"

      - name: Scrape the shared weekly score source
        if: steps.schedule.outputs.should_run == 'true'
        timeout-minutes: 10
        env:
          ADL_SCORE_STATUS: ${{ steps.schedule.outputs.score_status }}
          ADL_FORCE_SCORE_REFRESH: ${{ inputs.ready_week != '' && 'TRUE' || steps.schedule.outputs.force_refresh }}
          ADL_GM_FORCE_LIVE_ROSTERS: "TRUE"
        run: Rscript scripts/cache_current_scores.R

      - name: Validate the shared MFL snapshot
        if: steps.schedule.outputs.should_run == 'true'
        timeout-minutes: 5
        run: Rscript scripts/prepare_adl_weekly_source.R

      - name: Start official weekly cap snapshot
        id: cap_dispatch
        if: steps.schedule.outputs.should_run == 'true' && inputs.ready_week != '' && inputs.score_revision == '' && inputs.capture_cap_snapshot == true && inputs.authorize_official_writes == true
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
        shell: bash
        run: |
          completion_path="data/cap_accounting/${CURRENT_SEASON}/${CURRENT_SEASON}w${READY_WEEK}_ADLsalarycapcomplete.csv"
          if gh api "repos/TheMathNinja/ADL-Commissioner-Dashboard/contents/${completion_path}?ref=main" >/dev/null 2>&1; then
            echo "existing=true" >> "$GITHUB_OUTPUT"
            echo "Official Week ${READY_WEEK} cap snapshot is already complete; no new run will be dispatched."
            exit 0
          fi
          echo "existing=false" >> "$GITHUB_OUTPUT"
          title="Official Week ${READY_WEEK} cap snapshot (weekly package ${GITHUB_RUN_ID})"
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          dispatched=false
          for attempt in 1 2 3; do
            if gh workflow run weekly_salary_cap_accounting.yml \
              --repo TheMathNinja/ADL-Commissioner-Dashboard \
              --ref main \
              -f snapshot_week="${READY_WEEK}" \
              -f orchestrator_run_id="${GITHUB_RUN_ID}" \
              -f authorize_official_snapshot=true; then
              dispatched=true
              break
            fi
            sleep $((attempt * 10))
          done
          test "$dispatched" = true || { echo "Unable to dispatch cap accounting after 3 attempts."; exit 1; }

          for attempt in $(seq 1 60); do
            run_json=$(gh run list \
              --repo TheMathNinja/ADL-Commissioner-Dashboard \
              --workflow weekly_salary_cap_accounting.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle,createdAt,url \
              --jq ".[] | select(.displayTitle == \"${title}\" and .createdAt >= \"${dispatched_at}\")" | head -n 1)
            if [ -n "$run_json" ]; then
              run_id=$(jq -r .databaseId <<<"$run_json")
              run_url=$(jq -r .url <<<"$run_json")
              echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
              echo "run_url=${run_url}" >> "$GITHUB_OUTPUT"
              echo "Started ${run_url}"
              exit 0
            fi
            sleep 2
          done

          echo "The Commissioner Dashboard accepted the dispatch, but its run could not be identified."
          exit 1

      - name: Publish official workbook Elo
        id: elo
        if: steps.schedule.outputs.should_run == 'true' && inputs.authorize_official_writes == true
        continue-on-error: true
        timeout-minutes: 8
        env:
          LEAGUE: ADL
          APPS_SCRIPT_BRIDGE_URL: ${{ secrets.APPS_SCRIPT_BRIDGE_URL }}
          APPS_SCRIPT_BRIDGE_TOKEN: ${{ secrets.APPS_SCRIPT_BRIDGE_TOKEN }}
        run: |
          Rscript scripts/sync_google_weekly_system.R
          python3 scripts/elo_chart_range.py --league ADL --apply

      - name: Preserve Elo chart range verification
        if: always() && steps.elo.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: elo-chart-range-${{ github.run_attempt }}
          path: artifacts/elo-range/
          if-no-files-found: ignore

      - name: Preserve previous official Elo after an Elo-only failure
        if: steps.schedule.outputs.should_run == 'true' && steps.elo.outcome == 'failure'
        run: git restore data/elo_ratings.csv data/google_weekly_sync_metadata.csv data/elo_shadow_comparison.csv 2>/dev/null || true

      - name: Synchronize and collect official Bonus Games verification
        id: bonus_mfl
        timeout-minutes: 10
        if: steps.schedule.outputs.should_run == 'true' && inputs.authorize_official_writes == true && steps.schedule.outputs.score_status == 'official' && steps.elo.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN || github.token }}
        run: |
          gh workflow run verify_bonus_mfl.yml --ref main -f week="$READY_WEEK" -f mode=official \
            -f source_run_id="$GITHUB_RUN_ID" -f refresh_process="${REFRESH_PROCESS:-preliminary}"

          run_id=""
          for attempt in $(seq 1 30); do
            candidate="$(gh run list --workflow verify_bonus_mfl.yml --event workflow_dispatch --limit 20 --json databaseId,displayTitle --jq '.[] | select(.displayTitle | contains("source '"$GITHUB_RUN_ID"'")) | .databaseId' | head -n 1)"
            if [ -n "$candidate" ]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          test -n "$run_id" || { echo "Unable to locate dispatched Bonus Games verification run."; exit 1; }
          gh run watch "$run_id" --exit-status
          rm -rf /tmp/bonus-mfl-receipt
          gh run download "$run_id" --dir /tmp/bonus-mfl-receipt
          receipt="$(find /tmp/bonus-mfl-receipt -name bonus_mfl_sync_metadata.json -print -quit)"
          test -n "$receipt" || { echo "Bonus Games verification receipt artifact is missing."; exit 1; }
          cp "$receipt" data/bonus_mfl_sync_metadata.json

      - name: Refresh Extension Calculator data
        id: ext
        if: steps.schedule.outputs.should_run == 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: Rscript scripts/prepare_ext_data.R

      - name: Preserve previous EXT publication after an EXT-only failure
        if: steps.schedule.outputs.should_run == 'true' && steps.ext.outcome == 'failure'
        run: git restore -- $(git ls-files data/ext_candidates.csv data/salary_curves.csv data/ext_pr_summary.csv data/pr_history.csv data/pr_weekly_snapshots.csv data/ext_score_publication.rds)

      - name: Build playoff forecast and Tuesday Game of the Week swing data
        id: playoffs
        if: steps.schedule.outputs.should_run == 'true'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python scripts/fit_adl_scoring.py --season "${CURRENT_SEASON}"
          Rscript scripts/refresh_playoff_picture.R

      - name: Build selected Bonus Games dashboard
        id: bonus_dashboard
        continue-on-error: true
        timeout-minutes: 10
        if: steps.schedule.outputs.should_run == 'true' && steps.playoffs.outcome == 'success'
        run: |
          python scripts/bonus_module.py --league ADL --root . --out docs/bonus-games --simulations 12000
          python scripts/verify_quarterly_sync.py --league ADL --root .

      - name: Require synchronized quarterly forecasts before publication
        if: steps.schedule.outputs.should_run == 'true'
        env:
          PLAYOFF_RESULT: ${{ steps.playoffs.outcome }}
          BONUS_RESULT: ${{ steps.bonus_dashboard.outcome }}
        run: |
          test "$PLAYOFF_RESULT" = success
          test "$BONUS_RESULT" = success

      - name: Build playoff bracket from official workbook Elo
        id: bracket
        continue-on-error: true
        timeout-minutes: 5
        if: steps.schedule.outputs.should_run == 'true' && inputs.authorize_official_writes == true && steps.elo.outcome == 'success'
        run: |
          python scripts/bracket.py --league ADL

      - name: Add publication verification marker
        if: steps.schedule.outputs.should_run == 'true' && inputs.authorize_official_writes == true
        run: python3 scripts/publication_marker.py

      - name: Record score-correction impact
        if: steps.schedule.outputs.should_run == 'true' && inputs.score_revision != ''
        env:
          SCORE_REVISION: ${{ inputs.score_revision }}
        run: python3 scripts/correction_impact.py compare --league ADL --week "$READY_WEEK"

      - name: Commit generated data
        if: steps.schedule.outputs.should_run == 'true'
        timeout-minutes: 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/bonus-games docs/playoff-picture docs/trophy-room docs/weekly-refresh-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Automated unified ADL weekly refresh"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          echo "Failed to push generated data after 3 attempts."
          exit 1

      - name: Publish updated reports on GitHub Pages
        if: steps.schedule.outputs.should_run == 'true'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN || github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Dispatch independent calculator deployment
        if: steps.schedule.outputs.should_run == 'true' && steps.ext.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN || github.token }}
        run: gh workflow run deploy_dashboard.yml --ref main -f rebuild_ext_scores=false

      - name: Synchronize and verify Payouts
        id: payouts
        continue-on-error: true
        timeout-minutes: 15
        if: steps.schedule.outputs.should_run == 'true' && inputs.authorize_official_writes == true && steps.bracket.outcome == 'success'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          APPS_SCRIPT_BRIDGE_URL: ${{ secrets.APPS_SCRIPT_BRIDGE_URL }}
          APPS_SCRIPT_BRIDGE_TOKEN: ${{ secrets.APPS_SCRIPT_BRIDGE_TOKEN }}
        run: python scripts/sync_payouts.py --league ADL

      - name: Confirm official weekly cap snapshot and Cap Rollover update
        id: cap_snapshot
        if: steps.cap_dispatch.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
        shell: bash
        run: |
          if [ "${{ steps.cap_dispatch.outputs.existing }}" = "true" ]; then
            echo "Reusing the completed official Week ${READY_WEEK} cap snapshot."
            exit 0
          fi
          gh run watch "${{ steps.cap_dispatch.outputs.run_id }}" --repo TheMathNinja/ADL-Commissioner-Dashboard --exit-status

      - name: Record independent component results
        if: steps.schedule.outputs.should_run == 'true' && always()
        env:
          EXT_STATUS: ${{ steps.ext.outcome }}
          ELO_STATUS: ${{ steps.elo.outcome }}
          PLAYOFF_STATUS: ${{ steps.playoffs.outcome }}
          BONUS_DASHBOARD_STATUS: ${{ steps.bonus_dashboard.outcome }}
          BONUS_MFL_STATUS: ${{ steps.bonus_mfl.outcome }}
          PAYOUT_STATUS: ${{ steps.payouts.outcome }}
          BRACKET_STATUS: ${{ steps.bracket.outcome }}
          CAP_SNAPSHOT_STATUS: ${{ steps.cap_snapshot.outcome }}
          SCORE_STATUS: ${{ steps.schedule.outputs.score_status }}
        run: |
          cat > data/component_publish_status.csv <<EOF
          component,status,score_status,run_id
          source,success,${SCORE_STATUS},${GITHUB_RUN_ID}
          extension_calculator,${EXT_STATUS},${SCORE_STATUS},${GITHUB_RUN_ID}
          elo,${ELO_STATUS},${SCORE_STATUS},${GITHUB_RUN_ID}
          bonus_and_playoff_forecast,${PLAYOFF_STATUS},${SCORE_STATUS},${GITHUB_RUN_ID}
          playoff_bracket,${BRACKET_STATUS},${SCORE_STATUS},${GITHUB_RUN_ID}
          bonus_dashboard,${BONUS_DASHBOARD_STATUS},${SCORE_STATUS},${GITHUB_RUN_ID}
          bonus_mfl,${BONUS_MFL_STATUS},${SCORE_STATUS},${GITHUB_RUN_ID}
          payouts,${PAYOUT_STATUS},${SCORE_STATUS},${GITHUB_RUN_ID}
          official_cap_snapshot,${CAP_SNAPSHOT_STATUS},${SCORE_STATUS},${GITHUB_RUN_ID}
          EOF

      - name: Confirm weekly publication and record processed scores
        if: inputs.ready_week != '' && inputs.authorize_official_writes == true && success()
        env:
          SCORE_STATUS: ${{ steps.schedule.outputs.score_status }}
          COMPONENT_OUTCOMES: "${{ steps.bonus_dashboard.outcome }} ${{ steps.schedule.outputs.score_status != 'official' && 'success' || steps.bonus_mfl.outcome }} ${{ steps.payouts.outcome }} ${{ steps.ext.outcome }} ${{ steps.playoffs.outcome }} ${{ steps.elo.outcome }} ${{ steps.bracket.outcome }} ${{ (inputs.score_revision != '' || inputs.capture_cap_snapshot != true) && 'success' || steps.cap_dispatch.outcome }} ${{ (inputs.score_revision != '' || inputs.capture_cap_snapshot != true) && 'success' || steps.cap_snapshot.outcome }}"
        run: |
          for outcome in $COMPONENT_OUTCOMES; do
            test "$outcome" = success || { echo "A component did not finish; readiness poll may retry."; exit 1; }
          done
          python3 scripts/score_corrections.py --complete --week "$READY_WEEK"
          python3 scripts/score_readiness.py --complete
          python3 scripts/correction_impact.py promote --league ADL --week "$READY_WEEK"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/preliminary_refresh_complete.json data/processed_player_scores.json data/refresh_receipts data/official_score_output_baseline.json data/payouts_sync_metadata.json data/component_publish_status.csv
          git diff --cached --quiet || git commit -m 'Record successful weekly refresh and processed scores'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require a verified Payouts publication for every refresh
        if: always() && steps.schedule.outputs.should_run == 'true' && inputs.authorize_official_writes == true
        env:
          PAYOUT_STATUS: ${{ steps.payouts.outcome }}
        run: test "$PAYOUT_STATUS" = success

      - name: Require a successful playoff forecast publication
        if: always() && steps.schedule.outputs.should_run == 'true'
        env:
          PLAYOFF_STATUS: ${{ steps.playoffs.outcome }}
        run: test "$PLAYOFF_STATUS" = success

      - name: Require official MFL Bonus Games dispatch
        if: always() && steps.schedule.outputs.should_run == 'true' && inputs.authorize_official_writes == true && steps.schedule.outputs.score_status == 'official'
        env:
          BONUS_DASHBOARD_STATUS: ${{ steps.bonus_dashboard.outcome }}
          BONUS_MFL_STATUS: ${{ steps.bonus_mfl.outcome }}
        run: test "$BONUS_MFL_STATUS" = success

      - name: Require official cap snapshot for preliminary weekly publication
        if: always() && steps.schedule.outputs.should_run == 'true' && inputs.ready_week != '' && inputs.score_revision == '' && inputs.capture_cap_snapshot == true && inputs.authorize_official_writes == true
        env:
          CAP_DISPATCH_STATUS: ${{ steps.cap_dispatch.outcome }}
          CAP_SNAPSHOT_STATUS: ${{ steps.cap_snapshot.outcome }}
        run: |
          test "$CAP_DISPATCH_STATUS" = success
          test "$CAP_SNAPSHOT_STATUS" = success


  personal_chi_tools:
    name: Personal CHI Team Tools (after league publication)
    needs: refresh
    if: needs.refresh.result == 'success' && inputs.authorize_official_writes == true && inputs.ready_week != ''
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Queue the final personal forecast refresh
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
          READY_WEEK: ${{ inputs.ready_week }}
        run: >-
          gh workflow run refresh_chi_team_tools.yml
          --repo TheMathNinja/ADL-GM-Dashboard
          -f through_week="$READY_WEEK"
          -f source_league="ADL"
          -f upstream_run="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  request_completion_email:
    name: Request weekly completion email
    needs: refresh
    if: needs.refresh.result == 'success' && inputs.authorize_official_writes == true && inputs.ready_week != ''
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch shared completion verifier
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
        run: >-
          gh workflow run email_weekly_completion.yml
          --repo TheMathNinja/ADL-Commissioner-Dashboard
          -f dry_run=false
