name: Refresh Extension Calculator

on:
  workflow_dispatch:
    inputs:
      score_status:
        description: "Score scrape status"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - unofficial
          - official
      force:
        description: "Force refresh outside the normal season window"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "0 5 * * 2"
    - cron: "0 6 * * 2"
    - cron: "0 9 * * 4"
    - cron: "0 10 * * 4"

permissions:
  contents: write
  pages: write

concurrency:
  group: gm-dashboard-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      CURRENT_SEASON: "2026"
      ADL_RAW_LEAGUE_DATA_DIR: cache/raw_league_data
      R_LIBS_USER: ${{ github.workspace }}/_lib
      SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
      SHINYAPPS_APP_NAME: adl-ext-calculator
      ADL_GITHUB_WORKFLOW_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
      ADL_LEAGUE_ID: ${{ secrets.ADL_LEAGUE_ID }}
      MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
      MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
      MFL_USER_AGENT: ${{ secrets.MFL_USER_AGENT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Decide score status and season window
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SCORE_STATUS: ${{ inputs.score_status || 'manual' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: python3 scripts/score_schedule.py

      - name: Create cache directories
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          mkdir -p "${ADL_RAW_LEAGUE_DATA_DIR}"
          mkdir -p "${R_LIBS_USER}"
          mkdir -p data

      - name: Restore raw league data cache
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.ADL_RAW_LEAGUE_DATA_DIR }}
          key: ${{ runner.os }}-gm-raw-league-data-${{ env.CURRENT_SEASON }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-gm-raw-league-data-${{ env.CURRENT_SEASON }}-

      - name: Restore completed playoff training history
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: cache/playoff-picture
          key: ${{ runner.os }}-playoff-history-v1-${{ env.CURRENT_SEASON }}

      - name: Restore R package library cache
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-gm-r-lib-v1-${{ hashFiles('.github/workflows/refresh_extension_calculator.yml', 'DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-gm-r-lib-v1-

      - name: Install Ubuntu system libraries and R
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            r-base \
            r-base-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libssl-dev \
            libtiff5-dev \
            libxml2-dev \
            libuv1-dev \
            libnode-dev \
            pkg-config


      - name: Install and verify R packages
        if: steps.schedule.outputs.should_run == 'true'
        shell: Rscript {0}
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
          .libPaths(Sys.getenv("R_LIBS_USER"))
          options(repos = c(
            ffverse = "https://ffverse.r-universe.dev",
            CRAN = "https://cloud.r-project.org"
          ))

          packages <- c(
            "bslib", "dplyr", "ffscrapr", "ggplot2", "glue", "gt", "htmltools", "httr", "jsonlite", "lubridate",
            "nflreadr", "purrr", "readr", "readxl", "rsconnect", "scales",
            "shiny", "stringr", "tibble", "tidyr"
          )
          missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]

          if (length(missing) > 0) {
            install.packages(
              missing,
              dependencies = c("Depends", "Imports", "LinkingTo"),
              Ncpus = max(1, parallel::detectCores() - 1)
            )
          }

          min_rsconnect_version <- "1.10.1"
          if (requireNamespace("rsconnect", quietly = TRUE) && packageVersion("rsconnect") < min_rsconnect_version) {
            message("Updating rsconnect from ", packageVersion("rsconnect"), " to at least ", min_rsconnect_version, ".")
            install.packages("rsconnect", dependencies = c("Depends", "Imports", "LinkingTo"))
          }
          still_missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
          if (length(still_missing) > 0) {
            stop("R packages still not installed: ", paste(still_missing, collapse = ", "))
          }

      - name: Verify playoff qualification and seeding rules
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          Rscript tests/test_playoff_rules.R
          Rscript tests/test_postseason_draft.R
          Rscript tests/test_potential_forecast.R

      - name: Refresh score caches and calculator data
        if: steps.schedule.outputs.should_run == 'true'
        env:
          ADL_SCORE_STATUS: ${{ steps.schedule.outputs.score_status }}
          ADL_FORCE_SCORE_REFRESH: ${{ steps.schedule.outputs.force_refresh }}
          ADL_GM_FORCE_LIVE_ROSTERS: "TRUE"
        run: Rscript scripts/cache_current_scores.R

      - name: Refresh playoff picture from shared score cache
        if: steps.schedule.outputs.should_run == 'true'
        run: Rscript scripts/refresh_playoff_picture.R

      - uses: actions/setup-python@v5
        if: steps.schedule.outputs.should_run == 'true'
        with:
          python-version: '3.12'

      - name: Refresh Elo playoff bracket
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          pip install numpy==2.3.5 openpyxl==3.1.5
          python -m unittest discover -s tests -p test_bracket.py -v
          if ! python scripts/bracket.py --league ADL; then
            echo "::warning::Elo playoff bracket refresh failed. Calculator data refresh will continue."
          fi

      - name: Refresh NFL schedule cache
        if: steps.schedule.outputs.should_run == 'true'
        run: Rscript scripts/cache_nfl_schedule.R

      - name: Refresh compensatory picks
        if: steps.schedule.outputs.should_run == 'true'
        run: Rscript scripts/prepare_comp_data.R

      - name: Commit generated data
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/playoff-picture
          git diff --cached --quiet && exit 0
          git commit -m "Automated score, extension calculator, and playoff picture refresh"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done

          echo "Failed to push generated data after 3 attempts."
          exit 1

      - name: Publish updated reports on GitHub Pages
        if: steps.schedule.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN || github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Deploy calculator to shinyapps.io
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          if ! Rscript scripts/deploy_shinyapps.R; then
            echo "::warning::Data refresh succeeded, but shinyapps.io deployment failed. Check shinyapps.io credentials/status and rerun deployment if needed."
          fi
