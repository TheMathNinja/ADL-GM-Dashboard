name: Evaluate Historical Playoff Model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'R/historical_evaluation.R'
      - 'scripts/evaluate_playoff_model.R'
      - 'tests/test_historical_evaluation.R'
      - 'data/playoff_history/**'
      - '.github/workflows/evaluate_playoff_model.yml'
  pull_request:
    paths:
      - 'R/historical_evaluation.R'
      - 'scripts/evaluate_playoff_model.R'
      - 'tests/test_historical_evaluation.R'
      - 'data/playoff_history/**'
      - '.github/workflows/evaluate_playoff_model.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
      - name: Check season exclusion and held-out outcome isolation
        run: Rscript tests/test_historical_evaluation.R
      - name: Evaluate all other seasons and past-only comparison
        run: Rscript scripts/evaluate_playoff_model.R
      - uses: actions/upload-artifact@v4
        with:
          name: historical-playoff-model-evaluation
          path: data/model_evaluation/
