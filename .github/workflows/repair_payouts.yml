name: Verify ADL Payouts

on:
  workflow_dispatch:
    inputs:
      ready_week:
        description: Completed scoring week to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: adl-payouts-write
  cancel-in-progress: false

jobs:
  payouts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the ADL payout rebuild
        env:
          CURRENT_SEASON: '2026'
          READY_WEEK: ${{ inputs.ready_week }}
        run: python scripts/build_payouts.py --league ADL --check
