name: Verify MFL Bonus Games integration (read-only)
on:
  workflow_dispatch:
    inputs:
      week:
        description: Completed week in the published shared score snapshot
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gm-dashboard-data-writes
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CURRENT_SEASON: '2026'
      READY_WEEK: ${{ inputs.week }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install gspread==6.2.1
          node tests/test_bonus_mfl.cjs
          python scripts/sync_bonus_mfl.py --league ADL --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: bonus-mfl-read-only-verification-${{ github.run_attempt }}
          path: data/bonus_mfl_sync_metadata.json
