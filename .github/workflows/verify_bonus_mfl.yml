name: Synchronize MFL Bonus Games
on:
  workflow_dispatch:
    inputs:
      week:
        description: Completed week in the published shared score snapshot
        required: true
        type: string
      mode:
        description: Preview without writes, or perform the official idempotent MFL update
        required: true
        default: preview
        type: choice
        options:
          - preview
          - official
permissions:
  contents: read
concurrency:
  group: gm-dashboard-bonus-mfl
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CURRENT_SEASON: '2026'
      READY_WEEK: ${{ inputs.week }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      APPS_SCRIPT_BRIDGE_URL: ${{ secrets.APPS_SCRIPT_BRIDGE_URL }}
      APPS_SCRIPT_BRIDGE_TOKEN: ${{ secrets.APPS_SCRIPT_BRIDGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and synchronize Bonus Games
        timeout-minutes: 8
        run: |
          pip install gspread==6.2.1
          python -m unittest tests.test_score_corrections tests.test_workflow_failure_email tests.test_apps_script_bridge
          node tests/test_bonus_mfl.cjs
          if [ "${{ inputs.mode }}" = "official" ]; then
            python scripts/sync_bonus_mfl.py --league ADL --allow-queued
          else
            python scripts/sync_bonus_mfl.py --league ADL --dry-run
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bonus-mfl-${{ inputs.mode }}-${{ github.run_attempt }}
          path: data/bonus_mfl_sync_metadata.json
