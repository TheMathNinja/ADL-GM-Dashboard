name: Request private model compatibility check
on:
  push:
    branches: [main]
    paths: ['scripts/**/*.py', 'data/adl_scoring_model.json', 'requirements-weekly.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
        run: gh workflow run model_contract_preflight.yml --repo TheMathNinja/Chicago-Bears-Lineup-Guardian
