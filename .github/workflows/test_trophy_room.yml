name: Validate Trophy Room and shared GM history
on:
  pull_request:
    paths:
      - 'R/gm_history.R'
      - 'scripts/*gm*'
      - 'scripts/*trophy*'
      - 'data/gm*'
      - 'data/trophy_room/**'
      - 'docs/trophy-room/**'
      - '.github/workflows/test_trophy_room.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - run: Rscript scripts/test_gm_profiles.R
      - run: Rscript scripts/test_trophy_room.R
      - run: node --check docs/trophy-room/trophy.js
      - run: git diff --exit-code -- docs/trophy-room/data.json
