name: Request private CHI forecast refresh
on:
  workflow_dispatch:
    inputs:
      through_week:
        type: string
      source_league:
        type: string
      upstream_run:
        type: string
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Hand off to private personal tools
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
          WEEK: ${{ inputs.through_week }}
          LEAGUE: ${{ inputs.source_league }}
          UPSTREAM: ${{ inputs.upstream_run }}
        run: gh workflow run refresh_chi_team_tools.yml --repo TheMathNinja/Chicago-Bears-Lineup-Guardian -f through_week="$WEEK" -f source_league="$LEAGUE" -f upstream_run="$UPSTREAM"
