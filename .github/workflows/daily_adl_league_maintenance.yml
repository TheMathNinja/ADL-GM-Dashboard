name: Daily ADL League Maintenance
run-name: ${{ inputs.plan_only && 'Daily ADL League Maintenance (plan only)' || inputs.send_email && 'Daily ADL League Maintenance' || 'Daily ADL League Maintenance (no email)' }}

on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: Read delivery evidence without dispatching components or sending mail
        type: boolean
        default: false
      force_refresh:
        description: Run fresh components even if an identical package already succeeded today
        type: boolean
        default: false
      send_email:
        description: Send the normal Commissioner and waiver-correction emails
        required: false
        default: false
        type: boolean
      enable_mfl_salary_writes:
        description: Enable the controlled July 1 MFL salary write stage
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-adl-league-maintenance
  cancel-in-progress: false

jobs:
  plan:
    permissions:
      contents: read
      actions: read
    name: Daily intent v1 notify=${{ inputs.send_email }} salary=${{ inputs.enable_mfl_salary_writes }}
    runs-on: ubuntu-24.04
    outputs:
      prior: ${{ steps.plan.outputs.prior }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force_refresh }}
          INTENT: Daily intent v1 notify=${{ inputs.send_email }} salary=${{ inputs.enable_mfl_salary_writes }}
        run: |
          python3 -m unittest discover -s tests -p test_maintenance_plan.py
          python3 scripts/maintenance_plan.py
  refresh-commissioner-data:
    needs: plan
    if: needs.plan.outputs.prior == '' && !inputs.plan_only
    name: Refresh SalAdj and Commissioner data
    runs-on: ubuntu-24.04
    steps:
      - name: Check out orchestration helpers
        uses: actions/checkout@v6

      - name: Dispatch Commissioner-owned data refresh
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
          ENABLE_MFL_SALARY_WRITES: ${{ inputs.enable_mfl_salary_writes }}
          SEND_EMAIL: ${{ inputs.send_email }}
        shell: bash
        run: |
          bash tests/test_maintenance_resume.sh
          title="Daily maintenance ${GITHUB_RUN_ID} - Commissioner data"
          source scripts/resume_maintenance_child.sh
          resume_maintenance_child update_dashboard.yml "$title"
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run update_dashboard.yml \
            --repo TheMathNinja/ADL-Commissioner-Dashboard \
            --ref main \
            -f send_saladj_email="${SEND_EMAIL}" \
            -f enable_mfl_salary_writes="${ENABLE_MFL_SALARY_WRITES}" \
            -f mfl_salary_write_import_type="" \
            -f orchestrator_run_id="${GITHUB_RUN_ID}"

          for attempt in $(seq 1 60); do
            run_id=$(gh run list \
              --repo TheMathNinja/ADL-Commissioner-Dashboard \
              --workflow update_dashboard.yml \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,displayTitle,createdAt \
              --jq ".[] | select(.displayTitle == \"${title}\" and .createdAt >= \"${dispatched_at}\") | .databaseId" | head -n 1)
            if [ -n "${run_id}" ]; then
              bash scripts/wait_for_workflow_run.sh TheMathNinja/ADL-Commissioner-Dashboard "${run_id}" 480 5
              exit $?
            fi
            sleep 2
          done

          echo "Commissioner data refresh was dispatched but could not be correlated to this maintenance run."
          exit 1

  apply-waiver-cap-corrections:
    name: Apply waiver cap corrections
    needs: refresh-commissioner-data
    if: ${{ needs.refresh-commissioner-data.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out orchestration helpers
        uses: actions/checkout@v6

      - name: Dispatch Commissioner-owned waiver corrections
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
          SEND_EMAIL: ${{ inputs.send_email }}
        shell: bash
        run: |
          title="Daily maintenance ${GITHUB_RUN_ID} - Waiver corrections"
          source scripts/resume_maintenance_child.sh
          resume_maintenance_child waiver-cap-corrections.yml "$title"
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run waiver-cap-corrections.yml \
            --repo TheMathNinja/ADL-Commissioner-Dashboard \
            --ref main \
            -f send_email="${SEND_EMAIL}" \
            -f write_sheet="${SEND_EMAIL}" \
            -f verify_sheet_only=false \
            -f orchestrator_run_id="${GITHUB_RUN_ID}"

          for attempt in $(seq 1 60); do
            run_id=$(gh run list \
              --repo TheMathNinja/ADL-Commissioner-Dashboard \
              --workflow waiver-cap-corrections.yml \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,displayTitle,createdAt \
              --jq ".[] | select(.displayTitle == \"${title}\" and .createdAt >= \"${dispatched_at}\") | .databaseId" | head -n 1)
            if [ -n "${run_id}" ]; then
              bash scripts/wait_for_workflow_run.sh \
                TheMathNinja/ADL-Commissioner-Dashboard "${run_id}"
              exit $?
            fi
            sleep 2
          done

          echo "Waiver corrections were dispatched but could not be correlated to this maintenance run."
          exit 1

  refresh-rosters-and-extension:
    name: Refresh rosters, EXT and Salary Cap Manager
    needs: [plan, refresh-commissioner-data, apply-waiver-cap-corrections]
    if: ${{ !cancelled() && !inputs.plan_only && needs.plan.result == 'success' && needs.plan.outputs.prior == '' }}
    uses: ./.github/workflows/refresh_rosters.yml
    with:
      reason: daily-maintenance
    secrets: inherit

  run-commissioner-alerts:
    name: Run Commissioner alerts
    needs: [plan, refresh-commissioner-data, apply-waiver-cap-corrections, refresh-rosters-and-extension]
    if: ${{ !cancelled() && !inputs.plan_only && needs.plan.result == 'success' && needs.plan.outputs.prior == '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out orchestration helpers
        uses: actions/checkout@v6

      - name: Dispatch Commissioner-owned alerts
        env:
          GH_TOKEN: ${{ secrets.ADL_GITHUB_WORKFLOW_TOKEN }}
          SEND_EMAIL: ${{ inputs.send_email }}
        shell: bash
        run: |
          title="Daily maintenance ${GITHUB_RUN_ID} - Commissioner alerts"
          source scripts/resume_maintenance_child.sh
          resume_maintenance_child daily-commissioner-alerts.yml "$title"
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run daily-commissioner-alerts.yml \
            --repo TheMathNinja/ADL-Commissioner-Dashboard \
            --ref main \
            -f cutdown_id="" \
            -f send_email="${SEND_EMAIL}" \
            -f checked_at="" \
            -f orchestrator_run_id="${GITHUB_RUN_ID}"

          for attempt in $(seq 1 60); do
            run_id=$(gh run list \
              --repo TheMathNinja/ADL-Commissioner-Dashboard \
              --workflow daily-commissioner-alerts.yml \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,displayTitle,createdAt \
              --jq ".[] | select(.displayTitle == \"${title}\" and .createdAt >= \"${dispatched_at}\") | .databaseId" | head -n 1)
            if [ -n "${run_id}" ]; then
              bash scripts/wait_for_workflow_run.sh \
                TheMathNinja/ADL-Commissioner-Dashboard "${run_id}"
              exit $?
            fi
            sleep 2
          done

          echo "Commissioner alerts were dispatched but could not be correlated to this maintenance run."
          exit 1

  verify-package:
    name: ${{ needs.plan.outputs.prior && format('Reuse verified daily maintenance run {0}',needs.plan.outputs.prior) || 'Verify daily maintenance package' }}
    needs: [plan, refresh-commissioner-data, apply-waiver-cap-corrections, refresh-rosters-and-extension, run-commissioner-alerts]
    if: ${{ always() && !inputs.plan_only }}
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize component results
        env:
          COMMISSIONER_DATA: ${{ needs.refresh-commissioner-data.result }}
          WAIVER_CORRECTIONS: ${{ needs.apply-waiver-cap-corrections.result }}
          ROSTERS_EXTENSION: ${{ needs.refresh-rosters-and-extension.result }}
          COMMISSIONER_ALERTS: ${{ needs.run-commissioner-alerts.result }}
          PLAN: ${{ needs.plan.result }}
          PRIOR: ${{ needs.plan.outputs.prior }}
        shell: bash
        run: |
          test "$PLAN" = success
          if [ -n "$PRIOR" ]; then
            echo "Same-day delivery already verified in [run $PRIOR](https://github.com/$GITHUB_REPOSITORY/actions/runs/$PRIOR)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Daily ADL League Maintenance'
            echo
            echo '| Component | Result |'
            echo '|---|---|'
            echo "| SalAdj and Commissioner data | ${COMMISSIONER_DATA} |"
            echo "| Waiver cap corrections | ${WAIVER_CORRECTIONS} |"
            echo "| Rosters and Extension Calculator | ${ROSTERS_EXTENSION} |"
            echo "| Commissioner alerts | ${COMMISSIONER_ALERTS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$COMMISSIONER_DATA" = success
          test "$WAIVER_CORRECTIONS" = success
          test "$ROSTERS_EXTENSION" = success
          test "$COMMISSIONER_ALERTS" = success
