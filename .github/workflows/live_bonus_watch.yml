name: Live Bonus Game Watch
on:
  workflow_dispatch:
    inputs:
      once:
        description: Publish one snapshot instead of watching the active window
        type: boolean
        default: false
      dry_run:
        description: Read and validate one snapshot without publishing
        type: boolean
        default: false
      preview_week:
        description: Optional upcoming week to preview (dry_run only)
        type: string
        default: ''
  workflow_call:
    inputs:
      rollover_week:
        type: string
        required: true
      source_run:
        type: string
        required: true
  schedule:
    # Hourly bootstrap/continuation; the Python worker enforces America/New_York
    # hours and polls once per minute. Long workers bridge scheduling delays.
    - cron: '50 * * * 0-2,4,5'
permissions:
  contents: write
concurrency:
  # A short official rollover must not queue behind a six-hour live worker.
  # Atomic branch writes reject stale weeks and older correction provenance.
  group: ${{ inputs.rollover_week != '' && 'live-bonus-rollover' || 'live-bonus-watch' }}
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Check active watch window before installing dependencies
        id: window
        env:
          WATCH_ONCE: ${{ inputs.once }}
          DRY_RUN: ${{ inputs.dry_run }}
          ROLLOVER_WEEK: ${{ inputs.rollover_week }}
        run: |
          python3 - <<'PY'
          import datetime as dt, os, sys
          sys.path.insert(0, 'scripts')
          from collect_live_bonus import near_window
          ready = (os.environ['WATCH_ONCE'] == 'true' or os.environ['DRY_RUN'] == 'true'
                   or bool(os.environ['ROLLOVER_WEEK']) or near_window(dt.datetime.now(dt.timezone.utc)))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('active=' + str(ready).lower() + '\n')
          print('Live watch active' if ready else 'Outside watch hours; skipping dependencies and upstream requests')
          PY
      - uses: actions/setup-python@v5
        if: steps.window.outputs.active == 'true'
        with:
          python-version: "3.12"
      - name: Install live simulation dependency
        if: steps.window.outputs.active == 'true'
        run: python -m pip install "numpy==2.3.5" "pandas==2.3.3" "scipy==1.18.1"
      - name: Refresh public MFL live scores
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_ONCE: ${{ inputs.once }}
          DRY_RUN: ${{ inputs.dry_run }}
          PREVIEW_WEEK: ${{ inputs.preview_week }}
          ROLLOVER_WEEK: ${{ inputs.rollover_week }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          args=()
          if [ "$WATCH_ONCE" = "true" ]; then args+=(--once); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--once --dry-run); fi
          if [ -n "$PREVIEW_WEEK" ]; then args+=(--preview-week "$PREVIEW_WEEK"); fi
          if [ -n "$ROLLOVER_WEEK" ]; then args+=(--once --rollover-after-week "$ROLLOVER_WEEK" --source-run "$SOURCE_RUN"); fi
          python3 -m unittest discover -s tests -p test_player_availability.py -v
          python3 -m unittest discover -s tests -p test_live_bonus.py -v
          python3 -m unittest discover -s tests -p test_live_rollover.py -v
          python3 -m unittest discover -s tests -p test_live_archive.py -v
          node tests/test_live_windows.cjs
          python3 -m unittest discover -s tests -p test_live_nfl_scoreboard.py -v
          node tests/test_live_nfl_scoreboard.cjs
          python3 -m unittest discover -s tests -p test_live_unit_status.py -v
          node tests/test_live_unit_status.cjs
          python3 -m unittest discover -s tests -p test_fs_pregame_calibration.py -v
          python3 -m unittest discover -s tests -p test_live_bench.py -v
          node tests/test_live_bench.cjs
          python3 -m unittest discover -s tests -p test_live_continuous_nig.py -v
          python3 scripts/collect_live_bonus.py --league ADL "${args[@]}"

