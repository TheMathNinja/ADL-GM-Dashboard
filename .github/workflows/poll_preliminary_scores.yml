name: Poll preliminary score readiness
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check readiness without dispatching a refresh
        type: boolean
        default: true
      week:
        description: Optional scoring week for a manual readiness test
        type: string
        default: ""
  schedule:
    # Fixed 6:30/7:00/8:00/9:00 a.m. ET backups. Apps Script is the
    # 15-minute primary. UTC candidates below cover daylight-saving changes.
    - cron: '30 10 * * 2'
    - cron: '0 11 * * 2'
    - cron: '30 11 * * 2'
    - cron: '0 12 * * 2'
    - cron: '0 13 * * 2'
    - cron: '0 14 * * 2'
permissions:
  contents: read
  actions: write
concurrency:
  group: preliminary-score-readiness
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Select fixed Eastern backup slot
        id: timing
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo "should_run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          OFFSET=$(TZ=America/New_York date +%z)
          SLOT="${{ github.event.schedule }}"
          if { [ "$OFFSET" = "-0400" ] && { [ "$SLOT" = "30 10 * * 2" ] || [ "$SLOT" = "0 11 * * 2" ] || [ "$SLOT" = "0 12 * * 2" ] || [ "$SLOT" = "0 13 * * 2" ]; }; } || \
             { [ "$OFFSET" = "-0500" ] && { [ "$SLOT" = "30 11 * * 2" ] || [ "$SLOT" = "0 12 * * 2" ] || [ "$SLOT" = "0 13 * * 2" ] || [ "$SLOT" = "0 14 * * 2" ]; }; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.timing.outputs.should_run == 'true'
        with:
          ref: main
      - name: Validate readiness logic
        if: steps.timing.outputs.should_run == 'true'
        run: python3 -m unittest discover -s tests -p test_score_readiness.py -v
      - name: Check MFL and dispatch once
        if: steps.timing.outputs.should_run == 'true'
        env:
          CURRENT_SEASON: "2026"
          LEAGUE_ID: "60206"
          WORKER_WORKFLOW: "refresh_extension_calculator.yml"
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_WEEK: ${{ inputs.week }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          if [ -n "$TEST_WEEK" ]; then args+=(--week "$TEST_WEEK"); fi
          python3 scripts/score_readiness.py "${args[@]}"
